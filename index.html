<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 資安時差健檢</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:linear-gradient(160deg,#b0101a 0%,#d71920 60%,#e8404a 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:#222; padding:16px;
  }
  .card {
    background:#fff; border-radius:20px; width:100%; max-width:680px;
    padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .topbar {
    background:#fff; margin:-36px -32px 26px; border-radius:20px 20px 0 0;
    border-bottom:3px solid #d71920;
    padding:16px 26px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .topbar img { height:32px; display:block; }
  .topbar span { color:#8a8a8a; font-size:13px; letter-spacing:.04em; white-space:nowrap; }
  .brand { color:#d71920; font-weight:700; letter-spacing:.05em; font-size:14px; margin-bottom:8px; }
  h1 { font-size:28px; margin-bottom:12px; color:#2b2b2b; }
  .sub { color:#555; line-height:1.7; margin-bottom:24px; font-size:15px; }
  .btn {
    display:inline-block; background:#d71920; color:#fff; border:none; cursor:pointer;
    font-size:18px; font-weight:700; padding:14px 40px; border-radius:999px;
    transition:transform .15s, box-shadow .15s;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(215,25,32,.35); }
  .btn.ghost { background:#fff; color:#d71920; border:2px solid #d71920; }
  .part-tag {
    display:inline-block; background:#fdeaea; color:#d71920; font-size:13px;
    font-weight:700; padding:4px 12px; border-radius:999px; margin-bottom:14px;
  }
  .progress-wrap { background:#eee; height:8px; border-radius:99px; margin-bottom:22px; overflow:hidden; }
  .progress-bar { background:#d71920; height:100%; width:0%; transition:width .3s; }
  .q-num { color:#999; font-size:14px; margin-bottom:6px; }
  .q-text { font-size:20px; font-weight:700; line-height:1.6; margin-bottom:22px; color:#2b2b2b; }
  .opt {
    display:block; width:100%; text-align:left; background:#f7f7f9; border:2px solid #eceff3;
    border-radius:14px; padding:16px 18px; font-size:16px; line-height:1.6; cursor:pointer;
    margin-bottom:12px; transition:all .15s; color:#333;
  }
  .opt:hover { border-color:#d71920; background:#fff5f5; }
  .opt b { color:#d71920; margin-right:8px; }
  /* result */
  .score-circle {
    width:170px; height:170px; border-radius:50%; margin:8px auto 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;
  }
  .score-circle .num { font-size:52px; font-weight:800; line-height:1; }
  .score-circle .max { font-size:14px; opacity:.85; }
  .tier { text-align:center; font-size:26px; font-weight:800; margin-bottom:8px; }
  .advice { background:#f7f7f9; border-left:5px solid #d71920; border-radius:8px; padding:16px 18px; line-height:1.8; font-size:15px; margin:18px 0; color:#444; }
  .bars { margin:18px 0; }
  .bar-row { display:flex; align-items:center; margin-bottom:10px; font-size:14px; }
  .bar-label { width:140px; color:#555; }
  .bar-track { flex:1; background:#eee; border-radius:99px; height:12px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:99px; }
  .bar-pct { width:48px; text-align:right; color:#888; }
  .cta { text-align:center; margin-top:24px; }
  .cta p { color:#555; margin-bottom:14px; font-size:15px; }
  .footer-tools { text-align:center; margin-top:26px; border-top:1px dashed #ddd; padding-top:14px; }
  .footer-tools button { background:none; border:none; color:#aaa; font-size:12px; cursor:pointer; margin:0 8px; }
  .hidden { display:none; }
  input.field {
    width:100%; padding:12px 14px; font-size:16px; border:2px solid #eceff3;
    border-radius:12px; margin-bottom:14px;
  }
  @media (max-width:480px){
    .card{padding:26px 20px;} h1{font-size:23px;} .q-text{font-size:17px;}
    .topbar{margin:-26px -20px 20px; padding:12px 18px;}
    .topbar img{height:24px;} .topbar span{font-size:11px;}
  }
</style>
</head>

 {part:"Part 3｜防禦速度現況", q:"若發生資安事件，貴院從「發現異常」到「啟動應變」平均需要多久？",
  a:"1 小時內", b:"數小時內", c:"超過一天，或依賴人工回報才能發現"},
 {part:"Part 4｜人力與資源現況", q:"貴院資安團隊人力，是否足以應付目前的威脅量與系統規模？",
  a:"足夠，且有餘裕做主動防禦", b:"勉強應付日常，難有餘力做更多", c:"明顯不足，經常疲於奔命"},
 {part:"Part 4｜人力與資源現況", q:"貴院資安預算是否已編列 AI 相關風險（Shadow AI、AI 攻擊）因應項目？",
  a:"已有明確編列與規劃", b:"有討論，但尚未具體編列", c:"尚未納入考量"}
];

// 評分：每題 A=3、B=2、C=1，換算百分制：(原始分-11)÷22×100，滿分 100
const TIERS = [
 {min:75, name:"時差極小",
  advice:"貴院已具備良好的 AI 時代防禦韌性，建議持續優化 MDR 覆蓋率，並定期演練以維持應變速度。"},
 {min:40, name:"時差中等",
  advice:"貴院存在可被利用的時間窗口，建議優先強化 EDR 覆蓋率與事件應變流程，縮短從發現到處置的時間。"},
 {min:0, name:"時差顯著",
  advice:"貴院目前防禦速度明顯落後攻擊節奏，建議儘速進行資安健檢，並評估導入 MDR 全天候監控，補足人力與偵測缺口。"}
];

const PARTS = [
 {label:"現況情境", idx:[0,1]},
 {label:"AI 風險現況", idx:[2,3,4]},
 {label:"防禦速度", idx:[5,6,7,8]},
 {label:"人力與資源", idx:[9,10]}
];

let cur = 0, answers = [];

function show(id){ ["screen-start","screen-quiz","screen-result"].forEach(s=>document.getElementById(s).classList.toggle("hidden", s!==id)); }

function startQuiz(){ cur=0; answers=[]; show("screen-quiz"); render(); }

function render(){
  const q = QUESTIONS[cur];
  document.getElementById("pbar").style.width = (cur/QUESTIONS.length*100)+"%";
  document.getElementById("part-tag").textContent = q.part;
  document.getElementById("q-num").textContent = `第 ${cur+1} 題／共 ${QUESTIONS.length} 題`;
  document.getElementById("q-text").textContent = q.q;
  const opts = document.getElementById("opts");
  opts.innerHTML = "";
  [["A",q.a,3],["B",q.b,2],["C",q.c,1]].forEach(([k,txt,pt])=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<b>${k}</b>${txt}`;
    b.onclick = ()=>{ answers.push({k,pt}); cur++; cur<QUESTIONS.length ? render() : finish(); };
    opts.appendChild(b);
  });
}

function finish(){
  const raw = answers.reduce((s,a)=>s+a.pt,0);
  const score = Math.round((raw-11)/22*100);   // 百分制 0-100
  const tier = TIERS.find(t=>score>=t.min);
  show("screen-result");
  const circ = document.getElementById("score-circle");
  circ.style.background = "#d71920";
  document.getElementById("score-num").textContent = score;
  const tn = document.getElementById("tier-name");
  tn.textContent = tier.name;
  tn.style.color = "#d71920";
  document.getElementById("tier-advice").textContent = tier.advice;

  const bars = document.getElementById("part-bars");
  bars.innerHTML = "";
  PARTS.forEach(p=>{
    const got = p.idx.reduce((s,i)=>s+answers[i].pt,0), max = p.idx.length*3;
    const pct = Math.round((got-p.idx.length)/(max-p.idx.length)*100);
    bars.insertAdjacentHTML("beforeend",
      `<div class="bar-row"><div class="bar-label">${p.label}</div>
       <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#d71920"></div></div>
       <div class="bar-pct">${pct}%</div></div>`);
  });

  saveRecord(score, tier.name);
}

/* ---- 紀錄與匯出（供工作人員使用） ---- */
function loadRecords(){ try{ return JSON.parse(localStorage.getItem("healthcheck_records")||"[]"); }catch(e){ return []; } }
function saveRecord(score, tier){
  const rec = {
    time: new Date().toLocaleString("zh-TW"),
    hospital: document.getElementById("inp-hospital").value.trim(),
    name: document.getElementById("inp-name").value.trim(),
    answers: answers.map(a=>a.k).join(""),
    score, tier
  };
  try{
    const all = loadRecords(); all.push(rec);
    localStorage.setItem("healthcheck_records", JSON.stringify(all));
    document.getElementById("rec-count").textContent = `已累積 ${all.length} 筆`;
  }catch(e){}
}
function exportCSV(){
  const all = loadRecords();
  if(!all.length){ alert("目前沒有紀錄"); return; }
  let csv = "﻿時間,醫院,稱呼," + QUESTIONS.map((_,i)=>"Q"+(i+1)).join(",") + ",總分(100),等級\n";
  all.forEach(r=>{
    csv += `"${r.time}","${r.hospital}","${r.name}",${r.answers.split("").join(",")},${r.score},${r.tier}\n`;
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "AI資安時差健檢_紀錄.csv";
  a.click();
}
function clearRecords(){
  if(confirm("確定清除所有填答紀錄？")){ try{ localStorage.removeItem("healthcheck_records"); }catch(e){}
    document.getElementById("rec-count").textContent = ""; }
}
</script>
